<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 逆势重生</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><a class="auth-wordmark" href="/">逆势重生<span>小店的明天</span></a><p class="auth-kicker">换一块屏幕，小店的记录还在。</p><h1>回到自己的小店</h1><p>手机和电脑使用同一账号，就能继续查看、填写同一份资料。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="40" placeholder="请输入分配给你的账号"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="请输入密码"></label><button type="button" id="password-visibility" aria-pressed="false">显示密码</button><p class="auth-error" id="auth-error" role="alert" hidden></p><button class="auth-primary" type="submit">登录，进入我的店铺</button></form><p class="auth-note"><span id="registration-message">正在读取注册状态…</span>登录后12小时需要重新登录；请及时保存正在填写的内容。</p><a class="auth-primary" id="register-link" href="/register" hidden>没有账号？注册并开始测试</a><a href="/">返回首页</a></main></body></html>
