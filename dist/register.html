<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · 逆势重生</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><a class="auth-wordmark" href="/">逆势重生<span>小店的明天</span></a><h1>注册后，直接开始试用</h1><p id="registration-state" role="status">正在确认注册状态…</p><form id="register-form"><label>给自己起一个账号<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_-]{3,40}" placeholder="例如：xiaowang01"><small>用3至40位英文字母、数字、下划线或短横线，不区分大小写。</small></label><label>设置密码<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256" placeholder="至少12个字符"><small>可用一段自己记得住的短语，不要使用其他网站的密码。</small></label><label>再输入一次密码<input name="password_confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="256" placeholder="和上面的密码相同"></label><label class="auth-consent" id="demo-consent"><input type="checkbox" name="test_consent" required><span>我知道这是队员测试站，只填写虚构资料，不上传真实账目、客户信息或证件。</span></label><p id="auth-error" class="auth-error" role="alert" tabindex="-1" hidden></p><button type="submit" class="auth-primary" disabled>注册并进入测试</button></form><p class="auth-note">注册后自动进入自己的练习店，不需要下载测试包。手机和电脑用同一账号即可继续；不同账号的记录互相隔离。当前未接入真实AgentArts模型。</p><a href="/login">已经注册？去登录</a></main></body></html>
